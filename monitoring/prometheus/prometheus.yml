global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # 1. Scrape FastAPI Web Service
  - job_name: "app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:8080"]
        labels:
          environment: "local"
          service: "care-guide-service"

  # 2. Scrape cAdvisor (container metrics)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          environment: "local"

  # 3. Scrape Node Exporter (host metrics)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          environment: "local"
