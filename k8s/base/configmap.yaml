apiVersion: v1
kind: ConfigMap
metadata:
  name: care-guide-config
  labels:
    app.kubernetes.io/name: care-guide-service
    app.kubernetes.io/part-of: devops-assessment
data:
  PORT: "8080"
  LOG_LEVEL: "INFO"
  ENVIRONMENT_NAME: "kubernetes-production"
  # APP_VERSION is intentionally not set here: it is baked into the image (build arg) so the
  # reported version always matches the running image tag.
