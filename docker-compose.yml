services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      secrets:
        - corp_ca
    image: care-guide-app:local
    container_name: care-guide-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
      - ENVIRONMENT_NAME=local
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - app-net

# Optional corporate CA for builds behind a TLS-inspecting proxy:
#   CORP_CA_FILE=/usr/local/share/ca-certificates/<ca>.crt docker compose up -d --build
secrets:
  corp_ca:
    file: ${CORP_CA_FILE:-/dev/null}

networks:
  app-net:
    name: care-guide-network
    driver: bridge
