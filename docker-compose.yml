services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: care-guide-app:local
    container_name: care-guide-app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LOG_LEVEL=INFO
      - ENVIRONMENT_NAME=local
      - APP_VERSION=1.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 128M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - app-net

networks:
  app-net:
    name: care-guide-network
    driver: bridge
