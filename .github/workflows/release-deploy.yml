name: Release & Deploy to EC2

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build Multi-Arch Image & Push to GHCR
    runs-on: ubuntu-latest
    outputs:
      image_tag_sha: ${{ steps.meta.outputs.version }}
      full_image_name: ${{ steps.vars.outputs.image_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Variables
        id: vars
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          # Lowercase image name for GHCR compatibility
          echo "image_name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (Multi-Architecture Emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=v1.0.0
            type=raw,value=latest

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: Automated Deploy & Smoke Rollback via AWS SSM
    runs-on: ubuntu-latest
    needs: [build-and-push]
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      CLOUDWATCH_LOG_GROUP: ${{ vars.CLOUDWATCH_LOG_GROUP || '/aws/ec2/production-care-guide-service' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check AWS Deployment Configuration
        id: check_aws
        run: |
          if [ -n "${{ secrets.AWS_ROLE_TO_ASSUME }}" ] && [ -n "${{ secrets.AWS_EC2_INSTANCE_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::AWS OIDC credentials or instance ID secrets not set. Skipping live EC2 deployment."
          fi

      - name: Authenticate to AWS via GitHub OIDC (No Static Keys)
        if: steps.check_aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActionsCareGuideDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Execute Remote Deploy & Rollback via AWS SSM
        if: steps.check_aws.outputs.configured == 'true'
        run: |
          IMAGE_URI="${{ needs.build-and-push.outputs.full_image_name }}:sha-${{ github.sha::7 }}"
          echo "==> Triggering SSM deployment to instance: ${{ secrets.AWS_EC2_INSTANCE_ID }}"
          echo "==> Target Image: ${IMAGE_URI}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy image ${IMAGE_URI} via Care Guide CI/CD" \
            --parameters "commands=[\"/opt/care-guide/deploy.sh '${IMAGE_URI}' '${{ env.CLOUDWATCH_LOG_GROUP }}' '${{ env.AWS_REGION }}'\"]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command dispatched. ID: ${COMMAND_ID}"
          echo "Polling command status..."

          for i in {1..20}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Current Status: ${STATUS} (check $i/20)"

            if [ "$STATUS" = "Success" ]; then
              echo "==> Deployment and smoke tests SUCCEEDED!"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "==> Deployment FAILED on EC2! Reviewing execution log:"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 6
          done

          echo "Deployment timed out waiting for SSM completion."
          exit 1
